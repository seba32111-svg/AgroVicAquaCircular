name: Validar y empaquetar entrega

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entrega-final:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Preparar directorios
        run: mkdir -p artifacts database/exports dist

      - name: Ejecutar CP01 a CP16
        env:
          MONGO_URI: mongodb://localhost:27017
        run: >-
          python -m pytest -q tests
          --junitxml=artifacts/junit.xml
          --cov=backend
          --cov-report=term-missing
          --cov-report=xml:artifacts/coverage.xml

      - name: Comprobar matriz completa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('artifacts/test_results.json').read_text(encoding='utf-8'))
          assert result['executed'] == 16, result
          assert result['passed'] == 16, result
          assert result['exit_status'] == 0, result
          print(f"Resultado verificado: {result['passed']}/{result['total']} ({result['pass_rate']}%)")
          PY

      - name: Sembrar base demostrativa y exportar JSON
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: agrovic_aquacircular_ci
        run: python database/seed.py --database agrovic_aquacircular_ci --export-dir database/exports --artifact-dir artifacts

      - name: Instalar navegador de evidencia
        run: python -m playwright install --with-deps chromium

      - name: Levantar aplicación y capturar evidencias
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: agrovic_aquacircular_ci
          BASE_URL: http://127.0.0.1:5000
        run: |
          python -m backend.run > artifacts/server.log 2>&1 &
          echo $! > artifacts/server.pid
          python scripts/capture_evidence.py

      - name: Generar informe, presentación, guion y ZIP
        run: python scripts/generate_deliverables.py

      - name: Comprobar entregables
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          from pptx import Presentation
          expected = [
              'dist/Informe_Final_AgroVic_AquaCircular_Sebastian_Tapia.docx',
              'dist/Informe_Final_AgroVic_AquaCircular_Sebastian_Tapia.pdf',
              'dist/Presentacion_AgroVic_AquaCircular_Sebastian_Tapia.pptx',
              'dist/Guion_Defensa_AgroVic_AquaCircular_Sebastian_Tapia.docx',
              'dist/Entrega_Final_AgroVic_AquaCircular_Sebastian_Tapia.zip',
          ]
          for item in expected:
              path = Path(item)
              assert path.exists() and path.stat().st_size > 1000, item
          assert len(Presentation(expected[2]).slides) == 15
          with zipfile.ZipFile(expected[4]) as package:
              assert package.testzip() is None
              names = package.namelist()
              assert any(name.endswith('lecturas_sensor.json') for name in names)
              assert any('/frontend/' in name for name in names)
              assert any('/backend/' in name for name in names)
              assert not any('CREDENCIALES' in name or 'runtime_credentials' in name for name in names)
          print('Entregables íntegros, sin accesos locales, y presentación de 15 diapositivas.')
          PY

      - name: Conservar entrega comprobada
        uses: actions/upload-artifact@v4
        with:
          name: entrega-final-agrovic-aquacircular
          retention-days: 30
          compression-level: 9
          path: |
            dist/
            artifacts/test_results.json
            artifacts/junit.xml
            artifacts/coverage.xml
            artifacts/server.log
            artifacts/evidence/
            artifacts/diagramas/
            database/exports/
